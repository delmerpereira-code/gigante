<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A6E6E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plantão">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<title>Controle de Plantão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- LOADING -->
<div class="load" id="load"><div class="spinner"></div><div class="load-txt" id="load-txt">CARREGANDO</div></div>
<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- ═══ LOGIN ═══ -->
<div class="tela ativa" id="tela-login">
  <div class="login-box">
    <img class="login-logo" src="icon.svg" alt="">
    <div class="login-bar"></div>
    <div class="login-titulo">PLANTÃO</div>
    <div class="login-sub">Controle de escala e horas</div>
    <form id="form-login">
      <div class="campo">
        <label for="lg-email">E-mail</label>
        <input type="email" id="lg-email" autocomplete="username" inputmode="email" required>
      </div>
      <div class="campo">
        <label for="lg-senha">Senha</label>
        <input type="password" id="lg-senha" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn" id="lg-btn">Entrar</button>
      <div class="erro" id="lg-erro" hidden></div>
    </form>
    <button class="btn sec btn-instalar" id="btn-instalar">⬇ Instalar app</button>
    <div class="login-sub" id="lg-semcfg" hidden>Supabase não configurado (web/config.js).</div>
  </div>
</div>

<!-- ═══ HOME ═══ -->
<div class="tela" id="tela-home">
  <div class="corpo sem-pad">
    <div class="home-topo">
      <div class="home-oi">Bem-vindo,</div>
      <div class="home-nome" id="home-nome">—</div>
      <div class="home-papel" id="home-papel"></div>
    </div>
    <div class="home-cards" id="home-cards"></div>
  </div>
  <div class="acao-bar">
    <button class="btn sec" id="home-sair">Sair</button>
  </div>
</div>

<!-- ═══ MÓDULO (genérico) ═══ -->
<div class="tela" id="tela-modulo">
  <div class="hd">
    <button class="hd-back" id="mod-back">◀ Início</button>
    <div class="hd-titulo" id="mod-titulo">—</div>
    <div class="hd-acao" id="mod-acao"></div>
  </div>
  <div id="mod-faixa"></div>
  <div class="corpo" id="mod-corpo"></div>
  <div class="acao-bar" id="mod-barra" hidden></div>
</div>

<!-- ═══ MODAL ═══ -->
<div class="modal-bg" id="modal">
  <div class="modal" id="modal-conteudo"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="rotacao.js"></script>
<script src="db.js"></script>
<script src="store.js"></script>
<script src="sync.js"></script>
<script src="foto.js"></script>
<script src="app.js"></script>
<script src="telas/calendario.js"></script>
<script src="telas/escala.js"></script>
<script src="telas/ferias.js"></script>
<script src="telas/permuta.js"></script>
<script src="telas/eventos.js"></script>
<script src="telas/banco.js"></script>
<script src="telas/meu-cadastro.js"></script>
<script src="telas/funcionarios.js"></script>
<script src="telas/config.js"></script>
</body>
</html>
