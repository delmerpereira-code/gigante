<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eventos · Controle de Plantão</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="eventos">
  <header>
    <h1>Controle de Plantão</h1>
    <p>Folga abatendo banco, convocações e sobreaviso · férias em <a href="ferias.html">Férias</a> · troca de turno em <a href="permuta.html">Permuta</a></p>
  </header>
  <div id="nav"></div>

  <main>
    <div class="aviso" id="avisoSemFunc" hidden>
      Cadastre os funcionários primeiro em <a href="cadastro.html">Funcionários</a>.
    </div>

    <section class="card">
      <h2 id="formTitulo">Novo evento</h2>
      <form id="form" class="grid-form">
        <input type="hidden" id="eId">
        <label>Tipo
          <select id="eTipo">
            <option value="folga_abatendo_banco">Folga abatendo banco</option>
            <option value="convocacao">Convocação (quebra de proteção)</option>
            <option value="sobreaviso_escalado">Sobreaviso — escalado</option>
            <option value="sobreaviso_acionado">Sobreaviso — acionado</option>
          </select>
        </label>
        <label>Pessoa
          <select id="ePessoa"></select>
        </label>
        <label id="wrapSub">Substituto / contraparte
          <select id="eSub"><option value="">—</option></select>
        </label>
        <label>Início
          <input type="datetime-local" id="eInicio">
        </label>
        <label>Fim
          <input type="datetime-local" id="eFim">
        </label>
        <label class="wide">Observação
          <input type="text" id="eObs" autocomplete="off">
        </label>
        <div class="form-acoes">
          <button type="submit" class="primario">Salvar evento</button>
          <button type="button" id="btnCancelar" hidden>Cancelar</button>
          <span id="formErro" class="erro"></span>
        </div>
      </form>
      <div class="resultado" id="previa" hidden></div>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2 style="margin:0">Eventos lançados (<span id="qtd">0</span>)</h2>
        <span class="spacer"></span>
      </div>
      <div class="tabela-wrap">
        <table class="tabela" id="tabela">
          <thead>
            <tr><th>Início</th><th>Fim</th><th>Tipo</th><th>Pessoa</th><th>Substituto</th><th>Impacto no banco</th><th></th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>Controle de Plantão · dados locais neste navegador</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="rotacao.js"></script>
  <script src="db.js"></script>
  <script src="store.js"></script>
  <script src="sync.js"></script>
  <script src="nav.js"></script>
  <script src="eventos.js"></script>
  <script src="boot.js"></script>
</body>
</html>
